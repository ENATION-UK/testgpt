version: '3.8'

services:
  backend:
    image: registry.cn-hangzhou.aliyuncs.com/itbuilder/tester-backend:v1.0.0
    platform: linux/amd64  # 添加这行
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8000
      - USE_MYSQL=false
      - DISPLAY=:99
      - DOCKER_ENV=true
      - DATA_DIR=/app/data
      - DB_NAME=testgpt.db
    shm_size: '2gb'
    volumes:
      - ../backend:/app
      - ./data:/app/data
    networks:
      - testgpt-network

  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/itbuilder/tester-frontend:v1.0.0
    platform: linux/amd64  # 添加这行
    ports:
      - "3000:3000"
    env_file:
      - config.env
    depends_on:
      - backend
    networks:
      - testgpt-network

networks:
  testgpt-network:
    driver: bridge

volumes:
  data: